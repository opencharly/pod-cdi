#  opencharly/pod-cdi — the CDI GPU POD base box.
#
#  A POD DOES NOT OWN ITS GPU DRIVER. The kernel module is host-global, so the driver
#  user-space must come from the HOST and be injected per container by the container
#  runtime, through the NVIDIA container toolkit's CDI spec (`/etc/cdi/nvidia.yaml`,
#  generated on the host by `nvidia-ctk cdi generate`) and its runtime hook. An image
#  that bakes its own driver user-space does not merely duplicate the host's — it
#  shadows it, and `nvidia-container-toolkit` / `nvidia-ctk` are HOST tools that never
#  execute inside a container.
#
#  That is why this box composes `layer-cdi` and NEVER `layer-nvidia`:
#    layer-cdi     -> the POD contract: host-injected driver, no baked user-space,
#                      no nvidia binary in the image. Its own plan steps FAIL the build
#                      if a host-coupled driver library or nvidia binary is baked.
#    layer-nvidia  -> the VM contract: driver baked into the image, nvidia-ctk present.
#                      Correct for a GPU VM image, wrong for anything here.
#
#  Measured (2026-11-18): a pod built on this contract serves CUDA with NO
#  `/usr/bin/nvidia-ctk` in its image —
#    ComfyUI logs: "Device: cuda:0 NVIDIA GeForce RTX 4080 SUPER", "Total VRAM 16027 MB"
#  — while the host carries the toolkit and the spec:
#    /usr/bin/nvidia-ctk, /etc/cdi/nvidia.yaml (27076 bytes).
#
#  Consumers (all pods): box/ai-toolkit-cdi, box/comfyui-cdi, box/cuda-check-cdi,
#  box/immich-cdi, box/jupyter-ml-cdi, box/ollama-cdi, box/python-ml-cdi,
#  box/unsloth-studio-cdi in opencharly/distro-cachyos.

import:
    # A builder map does NOT cross a namespace boundary (distro-cachyos's own box/cachyos
    # states this outright): a box composed by someone else must declare its own map.
    # The pin tracks distro-arch's CURRENT release: it carries the owned-skill carrier chain
    # (distro-arch#76, sdk#607, plugin-box#92, charly#1230), without which an image built
    # through this base emits the retired `COPY --from=<carrier> .agents/skills` step and
    # fails on a cold build (opencharly/sdk#598).
    - arch: '@github.com/opencharly/distro-arch:v2026.328.1543'

pod-cdi:
    candy:
        description: |
            CDI GPU pod base — the container contract for GPU workloads.

            A GPU container gets its driver from the HOST, not from the image: the kernel
            module is host-global, so the driver user-space is injected per container by the
            runtime from the NVIDIA container toolkit's CDI spec. This box therefore composes
            layer-cdi, which owns that contract and whose plan steps FAIL the build if any
            host-coupled driver library or nvidia binary is baked in — the boundary is
            enforced, not merely documented.

            It deliberately contains NO nvidia-utils, NO LD_LIBRARY_PATH export and NO
            nvidia-ctk: those belong to a GPU VM image, where the guest owns its own
            kernel module and must bake the driver. Mixing the two contracts is what made
            every GPU pod demand a host tool in its image; measured 2026-11-18, a pod on this
            contract serves CUDA with no /usr/bin/nvidia-ctk present.
        # The upstream-published OCI image, pinned by DIGEST, addressed DIRECTLY.
        #
        # NOT `cachyos.cachyos` via an import of distro-cachyos: that would make this repo
        # depend on the very repo that consumes it, and distro-cachyos importing pod-cdi
        # back is a CYCLE. The distro vocabulary (pac) and the builder map do not cross a
        # namespace boundary, so a cycle does not merely warn — the consuming build dies
        # with `box pod-cdi has no distro definition to install [direnv] into`. Addressing
        # the upstream image directly removes the dependency entirely: nothing imports this
        # repo back, and this repo imports nothing that imports it.
        #
        # Same coordinate as distro-cachyos's box/cachyos, which pins it for the same
        # reason: Docker Hub publishes only a rolling tag for cachyos-v3, so a digest is the
        # most precise coordinate available. Refreshed 2026-11-24 to the digest Docker Hub
        # published for `latest` on 2026-11-22T20:29Z (was sha256:f50fa295…, 2026-10-20):
        #   curl -s https://hub.docker.com/v2/repositories/cachyos/cachyos-v3/tags?page_size=1 \
        #     | jq -r ".results[0].digest"
        base: docker.io/cachyos/cachyos-v3@sha256:bf1a0a07ba61654a110ad7958a2d7df895d55e734cd1bb827c6cfb2f5b94452b
        platform:
            - linux/amd64
        # Declared HERE, not inherited: builder maps do not cross a namespace boundary, so a
        # box that is composed by a consumer must carry its own map or the consumer fails.
        build:
            - pac
        # The distro VOCABULARY, declared here because this box bases on the upstream OCI
        # image directly and so inherits no vocabulary from a distro repo. Without it,
        # `layer-direnv` (via layer-agent-forwarding) fails with
        #   resolved 1 package(s) [direnv] but box pod-cdi has no distro definition
        # Same two entries distro-cachyos's box/cachyos declares.
        distro:
            - cachyos
            - arch
        builder:
            aur: arch.arch-builder
            cargo: arch.arch-builder
            npm: arch.arch-builder
            pixi: arch.arch-builder
        candy:
            - '@github.com/opencharly/layer-agent-forwarding:v2026.314.0704'
            # The tag is the CONTRACT here, not a version bump: v2026.329.2058 is the release
            # whose contract NO LONGER requires `layer-cuda` (opencharly/layer-cdi#24) — the
            # toolkit installs driver-free at the source and the consumer CLASS decides who
            # composes it. Pinning this release is what makes a pod that names nothing
            # toolkit-free: the contract, the OpenCL ICD file and the build-time assertions, with
            # no CUDA toolkit and no driver user-space. A class-2/3 consumer composes
            # `layer-cuda` itself (opencharly/opencharly#1287).
            - '@github.com/opencharly/layer-cdi:v2026.329.2058'
